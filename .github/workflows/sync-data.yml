name: Sync politician data

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC — 04:00/05:00 Berlin
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Exit code 75 means the API kept answering HTTP 403 (runner IP
      # blocked). The run is then skipped and the last published data stays.
      - name: Fetch politician data
        id: sync
        run: |
          set +e
          npm run server:sync
          code=$?
          if [ "$code" -eq 75 ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Deploy to GitHub Pages
        if: steps.sync.outputs.skipped != 'true'
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./server/data
          exclude_assets: '.gitkeep'
          keep_files: true
